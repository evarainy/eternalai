name: CI

on:
  push:
    branches: ["phase1/**", "phase0/main"]
  pull_request:
    branches: [phase0/main]

permissions:
  contents: read

env:
  UV_SYSTEM: "1"

jobs:
  changes:
    name: Classify changes and check diff
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: scope
        shell: python
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          import os
          import subprocess
          from pathlib import PurePosixPath

          base, head = os.environ["BASE_SHA"], os.environ["HEAD_SHA"]
          if not base or set(base) == {"0"}:
              docs_only = False
          else:
              if os.environ["GITHUB_EVENT_NAME"] == "pull_request":
                  base = subprocess.check_output(
                      ["git", "merge-base", base, head], text=True
                  ).strip()
              subprocess.run(["git", "diff", "--check", base, head], check=True)
              paths = subprocess.check_output(
                  ["git", "diff", "--name-only", "--no-renames", "-z", base, head]
              ).decode().rstrip("\0").split("\0")
              def is_doc(path):
                  p = PurePosixPath(path)
                  return (
                      path in {"AGENTS.md", "CLAUDE.md", "README.md"}
                      or (path.startswith("docs/") and p.suffix == ".md")
                      or (path.startswith((".agents/skills/", ".claude/skills/"))
                          and p.name == "SKILL.md")
                  )
              docs_only = bool(paths) and all(is_doc(p) for p in paths)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"docs_only={str(docs_only).lower()}\n")
          print(f"Documentation-only change: {docs_only}")
      - name: Install uv for documentation checks
        if: steps.scope.outputs.docs_only == 'true'
        uses: astral-sh/setup-uv@v4
      - name: Check existing documentation contracts
        if: steps.scope.outputs.docs_only == 'true'
        run: uv run --no-project --with pytest pytest --noconftest -p no:cacheprovider tests/architecture/test_governance_document_ssot.py -q
      - name: Parse skill metadata
        if: steps.scope.outputs.docs_only == 'true'
        run: |
          uv run --no-project --with pyyaml python - <<'PY'
          from pathlib import Path
          import yaml

          for root in (Path('.agents/skills'), Path('.claude/skills')):
              for path in root.glob('*/SKILL.md'):
                  parts = path.read_text(encoding='utf-8').split('---', 2)
                  assert len(parts) == 3 and not parts[0].strip(), path
                  metadata = yaml.safe_load(parts[1])
                  assert isinstance(metadata, dict), path
                  for key in ('name', 'description'):
                      assert isinstance(metadata.get(key), str) and metadata[key].strip(), (path, key)
                  print(f'Parsed {path}')
          PY

  backend-checks:
    name: Backend full checks
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg18
        env:
          POSTGRES_USER: eternalai
          POSTGRES_PASSWORD: change_me_test
          POSTGRES_DB: eternalai_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U eternalai -d eternalai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://eternalai:change_me_test@127.0.0.1:15432/eternalai_test
      POSTGRES_USER: eternalai
      POSTGRES_PASSWORD: change_me_test
      POSTGRES_DB: eternalai_test
      POSTGRES_PORT: 15432

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: |
          uv sync --locked
          uv run --locked python --version

      - name: Install Chromium for Playwright
        run: uv run playwright install --with-deps chromium

      # ── Lint ─────────────────────────────────────────────────
      - name: Ruff check
        run: uv run ruff check .

      # ── Type check ───────────────────────────────────────────
      - name: mypy
        run: uv run mypy app

      # ── Dependency allowlist ─────────────────────────────────
      - name: Dependency check
        run: uv run python scripts/check_dependencies.py

      # ── Architecture tests ───────────────────────────────────
      - name: Import boundary check
        run: uv run pytest tests/architecture/test_import_boundaries.py -v

      - name: Weak-test checker (unit tests)
        run: uv run pytest tests/architecture/test_weak_test_checker.py -v

      - name: Weak-test scan
        run: uv run python scripts/check_weak_tests.py tests

      # ── Alembic autogenerate guard ──────────────────────────
      - name: Alembic autogenerate guard
        run: |
          ! grep -R "auto generated by Alembic" alembic/versions/

      # ── Full pytest ──────────────────────────────────────────
      - name: Run pytest
        run: uv run pytest -v

      # ── Golden task regression gate ──────────────────────────────────
      # Activates the deferred CI step from P0-GT-002 §6 + P0-INFRA-007 pending actions.
      - name: Golden tasks
        run: uv run python scripts/run_golden_tasks.py --gate

  frontend-checks:
    name: Frontend full checks
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv for OpenAPI drift test
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python for OpenAPI drift test
        run: uv python install

      - name: Install backend dependencies for OpenAPI drift test
        run: |
          uv sync --frozen
          uv run --frozen python --version

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: ESLint
        working-directory: web
        run: pnpm lint

      - name: TypeScript check
        working-directory: web
        run: pnpm typecheck

      - name: Test
        working-directory: web
        run: pnpm test

      - name: Build
        working-directory: web
        run: pnpm build

  # Keep required check names stable, including for documentation-only changes.
  backend:
    name: Backend (lint, type, test)
    needs: [changes, backend-checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful applicable checks
        env:
          ACCEPTED: ${{ needs.changes.result == 'success' && (needs.backend-checks.result == 'success' || (needs.changes.outputs.docs_only == 'true' && needs.backend-checks.result == 'skipped')) }}
        run: test "$ACCEPTED" = "true"

  frontend:
    name: Frontend (lint, typecheck, test, build)
    needs: [changes, frontend-checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful applicable checks
        env:
          ACCEPTED: ${{ needs.changes.result == 'success' && (needs.frontend-checks.result == 'success' || (needs.changes.outputs.docs_only == 'true' && needs.frontend-checks.result == 'skipped')) }}
        run: test "$ACCEPTED" = "true"
