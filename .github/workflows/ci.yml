name: CI

on:
  push:
    branches: ["phase1/**", "phase0/main"]
  pull_request:
    branches: [phase0/main]

permissions:
  contents: read

env:
  UV_SYSTEM: "1"

jobs:
  backend:
    name: Backend (lint, type, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg18
        env:
          POSTGRES_USER: eternalai
          POSTGRES_PASSWORD: change_me_test
          POSTGRES_DB: eternalai_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U eternalai -d eternalai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://eternalai:change_me_test@127.0.0.1:55432/eternalai_test
      POSTGRES_USER: eternalai
      POSTGRES_PASSWORD: change_me_test
      POSTGRES_DB: eternalai_test
      POSTGRES_PORT: 55432

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      # ── Lint ─────────────────────────────────────────────────
      - name: Ruff check
        run: uv run ruff check .

      # ── Type check ───────────────────────────────────────────
      - name: mypy
        run: uv run mypy app

      # ── Dependency allowlist ─────────────────────────────────
      - name: Dependency check
        run: uv run python scripts/check_dependencies.py

      # ── Architecture tests ───────────────────────────────────
      - name: Import boundary check
        run: uv run pytest tests/architecture/test_import_boundaries.py -v

      - name: Weak-test checker (unit tests)
        run: uv run pytest tests/architecture/test_weak_test_checker.py -v

      - name: Weak-test scan
        run: uv run python scripts/check_weak_tests.py tests

      # ── Alembic autogenerate guard ──────────────────────────
      - name: Alembic autogenerate guard
        run: |
          ! grep -R "auto generated by Alembic" alembic/versions/

      # ── Full pytest ──────────────────────────────────────────
      - name: Run pytest
        run: uv run pytest -v

      # ── Golden task regression gate ──────────────────────────────────
      # Activates the deferred CI step from P0-GT-002 §6 + P0-INFRA-007 pending actions.
      - name: Golden tasks
        run: uv run python scripts/run_golden_tasks.py --gate

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: ESLint
        working-directory: web
        run: pnpm lint

      - name: TypeScript check
        working-directory: web
        run: pnpm typecheck

      - name: Test
        working-directory: web
        run: pnpm test

      - name: Build
        working-directory: web
        run: pnpm build
