judgment: |
  Extends the 003b0 pass-through gateway into a 4-precheck short-circuit skeleton via TDD.
  Short-circuit order (Registry → Identity → Policy → Trace pre → Adapter → Trace post) is
  structurally enforced and tested independently per path. SentinelAdapter pattern (raises
  AssertionError on .execute()) ensures adapter-not-called assertions are structurally enforced,
  not just counted. call_log spy list verifies record_gateway_call precedes adapter call on
  happy path. All 5 IdentityBindStatus mappings are tested independently (no collapsing).
  verification_failed→identity_unbound mapping is explicitly tested.
  binding_required status is the only ExecutionStatus member semantically valid for identity
  failures (process of elimination from the 7-member TypeAlias); a comment cites this authority.
  Optional-port defaults preserve 003b0 backward compat; the 3 Opus P3 advisory findings about
  this forward-wiring seam are expected and deferred to the downstream wiring task.
  TracePort receives no plaintext secrets/tokens anywhere; arguments dict is never forwarded to
  trace attributes.
