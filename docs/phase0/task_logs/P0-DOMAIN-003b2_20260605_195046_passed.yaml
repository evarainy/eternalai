judgment: |
  Extends the 003b1 short-circuit gateway into a multi-adapter dispatch skeleton via TDD.
  Adapter injection is via a single dict[str, AdapterPort] parameter named "adapters",
  keyed by target_system string (oa/u8/hikvision_ivms). Dispatch selection happens after
  all 4 prechecks and before record_gateway_call, so target_system=None returns
  no_capability_found without emitting a spurious trace entry.
  Backward-compat dual-path constructor (legacy "adapter" positional param + new "adapters"
  dict) preserves all 18 pre-003b2 tests unmodified, including the legacy target_system=None
  to adapter-called behavior.
  All 6 008e error injection modes (timeout/permission_denied/malformed_json/empty_response/
  http_500/missing_required_field) are tested with exact status+error_code assertions;
  mapping is exhaustive. SentinelAdapter guards non-target adapters in each dispatch test;
  the matching-adapter-only test independently counts call_count for all three adapters.
  Gateway production code imports no Mock adapter classes; enforced by an in-test scanner
  that reads the gateway directory and asserts on exact class names.
