summary: >
  Defined the Phase 0 Policy Guard interface contract only, in app/ports/policy_guard.py.
  Added PolicyDecisionValue and PolicyRequiredAction TypeAliases, the PolicyDecision model
  (exact spec section 8.6.6 field shape, with model_config extra=forbid), and the
  PolicyGuardPort Protocol with decide(ai_user_id, capability_id, arguments,
  request_context) -> PolicyDecision (exact spec section 8.6.8 signature). RequestOrgContext
  is IMPORTED from app.ports.capability_gateway rather than reproduced (human-ratified GATE 1
  decision), since spec 8.6.8 types request_context as that same shared 003a contract;
  capability_gateway.py was not modified. reason_code is kept as the spec-faithful open
  str | None (NOT tightened to a Literal), per the 003a carry-forward lesson; the three
  required reason codes (role_not_allowed, policy_denied, high_risk_action_requires_confirm)
  are covered by tests. No policy/role/risk/approval evaluation logic, control-plane behavior,
  or gateway integration was introduced (those belong to downstream policy/runtime tasks).
  Executed via the Orchestrator-Worker pipeline in an isolated git worktree (codex exec -C at
  E:\code\eternalai-wt-004a), run concurrently with P0-DOMAIN-008a in a separate worktree
  (first validated parallel pipeline run). Codex generated the Plan, Claude Code adversarially
