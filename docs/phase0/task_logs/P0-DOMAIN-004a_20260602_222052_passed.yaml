contract_model_decisions:
  policy_decision: "PolicyDecision reproduces spec 8.6.6 field shape exactly: decision: PolicyDecisionValue (Literal[allow,deny,confirm]); reason_code: str | None = None; required_action: PolicyRequiredAction | None = None (Literal[confirm,none]|None). model_config=ConfigDict(extra='forbid') was added (human-ratified GATE 1 decision) to close the frozen policy-boundary return contract to exactly its three spec fields; spec 8.6.6 defines no extra fields, so closing it cannot reject any valid spec-shaped decision and prevents accidental leakage of invented policy metadata."
  reason_code_openness: "reason_code is intentionally kept as the spec-faithful open str | None and was NOT tightened to a Literal, applying the P0-DOMAIN-003a carry-forward lesson (do not tighten a spec str to a Literal unless explicitly authorized). The three required reason codes are asserted representable, and test_policy_decision_accepts_arbitrary_reason_code locks in the open-string contract so a future tightening would fail a test."
  request_context_sourcing: "RequestOrgContext is IMPORTED from app.ports.capability_gateway (the merged 003a shared context model) rather than reproduced locally, because spec 8.6.8 types decide()'s request_context as that exact shared type. The import-boundary checker only forbids app.ports->app.infra, so this port->port import passes; capability_gateway.py was NOT modified. Local reproduction was rejected because duplicating the context model has no sync guardrail (drift risk)."
  package_layout: "No __init__.py created anywhere, matching the established app/ports and tests namespace-package convention (mypy strict + pytest pythonpath='.')."
  cross_field_validation: "No cross-field validator couples required_action to decision; that is downstream policy/composition behavior, out of scope for this interface-only contract task."
