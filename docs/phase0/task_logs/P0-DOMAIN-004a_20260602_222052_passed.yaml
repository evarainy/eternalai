  evidence: "uv run pytest tests/architecture/ => 22 passed. app/ports/policy_guard.py imports only from app.ports.capability_gateway (RequestOrgContext) plus stdlib/pydantic, not app.infra; the active ports_no_infra_imports rule is satisfied; no rule forbids port-to-port imports."
