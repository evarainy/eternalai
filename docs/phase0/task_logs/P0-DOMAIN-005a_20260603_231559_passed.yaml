summary: >
  Added TracePort interface contract (app/ports/trace.py) and 36 contract tests
  (tests/ports/test_trace_port.py). Defines TraceEvent model per spec 8.6.7,
  TracePort Protocol with async record_event (spec 8.6.8), five wrapper methods
