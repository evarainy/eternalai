judgment: >
  P0-DOMAIN-007b implements the Phase 0 Runtime main chain: handle_user_message wires TaskStore +
  StructuredOutput + CapabilityGateway + TracePort + ResponseEnvelopeBuilder into a single async
  flow. RuntimeImpl lives in app/runtime/ with constructor injection of all 6 ports; no
  execution_fabric imports; ResponseEnvelope imported from app.ports.response_envelope. All 7
  ExecutionResult status values are mapped per the approved table, with binding_required correctly
  using build_operator_handback (per Opus P1 mandate from plan review). CapabilityRef.model_validate
  is called explicitly to unwrap the Any-typed StructuredOutputResult.parsed field (per Opus P1
  mandate). Trace event sequences for both happy path and no_capability_found match the spec exactly.
  The router factory (make_router) is tested via a test-local FastAPI app without modifying
  app/main.py, which is the approved Phase 0 pattern. 15/15 runtime tests, 22/22 architecture
  boundary tests, 8/8 port regression tests all pass.

