contract_model_decisions:
  adapter_result: "AdapterResult reproduces spec 8.6.5 field shape exactly: status: AdapterStatus (Literal[success,error,timeout,permission_denied]); data: dict[str,Any]|None=None; error_code: ErrorCode|None=None; raw_payload_ref: str|None=None. model_config=ConfigDict(extra='forbid') was added (human-ratified GATE 1 decision) to close the frozen return contract to exactly its four spec fields; spec 8.6.5 defines no extra fields, so closing it cannot reject any valid spec-shaped result. Note: extra=forbid guards only top-level fields; data: dict[str,Any] is an acknowledged escape hatch whose contents downstream code must sanitize."
  error_code_sourcing: "ErrorCode is IMPORTED from app.ports.capability_gateway (the merged 003a 15-value shared Literal) rather than reproduced locally. Spec 8.6.5 types error_code as Optional[ErrorCode] (the same 8.6.3 ErrorCode), so a single source of truth avoids drift; the import-boundary checker only forbids app.ports->app.infra, so this port->port import passes. capability_gateway.py was NOT modified. The alternative (local reproduction) was rejected because duplicating a 15-value Literal has no sync guardrail."
  mock_error_mode_and_mapping: "MockErrorMode = Literal[timeout, permission_denied, malformed_json, empty_response, http_500, missing_required_field] documents the supported execution_context['mock_error_mode'] key values without tightening execute()'s execution_context parameter (kept dict[str,Any] per spec 8.6.8). The mock_error_mode -> ErrorCode mapping is frozen as MOCK_ERROR_MODE_TO_ERROR_CODE: Mapping[MockErrorMode, ErrorCode] = MappingProxyType({...6 pairs...}); this is static contract DATA (a lookup table), not adapter behavior (no payload parsing, failure injection, system call, or status conversion). The three enums are kept distinct: AdapterStatus (4 result statuses), MockErrorMode (6 injection modes), ErrorCode (15 shared codes)."
  package_layout: "No __init__.py created anywhere, matching the established app/ports and tests namespace-package convention (mypy strict + pytest pythonpath='.')."
  blueprint_status_ok_note: "Later blueprint mock-adapter prose mentions AdapterResult(status='ok'), but spec 8.6.5 fixes status to success/error/timeout/permission_denied; this task implements 8.6.5 and a test asserts status='ok' raises ValidationError. Reconciliation of the prose is deferred to downstream tasks/review."
