summary: >
  MockOAAdapter dispatches by capability_id (workflow_status/get_workflow keyword triggers
  workflow-status path; else pending-workflow). Error modes are read from
  execution_context["mock_error_mode"] and mapped via MOCK_ERROR_MODE_TO_ERROR_CODE imported
  directly from app.ports.adapter (never copied). Both happy-path shapes accept
  arguments["mock_status"] and arguments["mock_current_step"] for Literal value testing.
  No HTTP client imports confirmed. OA technical doc (E-cology 9) noted for Phase 1 real
  adapter - not used in Phase 0 mock.

