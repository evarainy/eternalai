judgment: >
  P0-DOMAIN-008e introduces a deterministic error-injection control plane for Phase 0 mock
  adapters. The InjectionAwareAdapter wrapper intercepts adapter.execute() calls and short-circuits
  to an explicit AdapterResult(status="error") when an injection is active, without delegating to
  the inner adapter or mutating execution_context. The should_register() guard ensures the FastAPI
  router is only included when ENV=testing or PHASE0_MOCK_MODE=true. All three duration contracts
  (next_1_call, next_3_calls, permanent) are implemented with a countdown-based module-level
  registry. 22 tests cover: endpoint availability guard (6), endpoint guard+validation (5),
  lifecycle duration contracts (6), end-to-end all-6-error-modes parametrization, and state-leak
  prevention. Opus approved without changes. No forbidden paths touched; no new dependencies.

