contract_model_decisions:
  ui_component_and_envelope: "UIComponent and ResponseEnvelope reproduce spec 8.6.4 field shapes exactly, with model_config extra=forbid. schema_version is str with default 'phase0.sdui.v1' (not Literal). ResponseEnvelope.status is a local 5-value Literal (completed/blocked/waiting_user/failed/no_capability_found), intentionally distinct from capability_gateway.ExecutionStatus (7 values); ExecutionStatus/ErrorCode/ExecutionResult/RequestOrgContext/TaskRecord are NOT imported and capability_gateway.py is NOT modified."
  card_specializations: "ConfirmCard, OperatorHandbackCard, BindingRequiredCard are UIComponent subclasses fixing component_type (class identity) and constraining action. action is a REQUIRED field on all three cards (no default) so action is never silently auto-filled, honoring spec :2578 forbidden_shortcut 禁止自动补 action; component_type keeps its identity default. ConfirmCard.action=Literal['confirm'] enforces one-shot confirm with no multi-turn state machine."
  user_action: "UserAction = {action_type: Literal['confirm'], response_id: str, confirmed: Literal[True]} with extra=forbid. Spec 8.6.4 defines no UserAction model; this minimal shape is frozen to match Golden Task GT-007 (spec :3255-3258) which uses {action_type: confirm, response_id, confirmed: true}. confirmed=Literal[True] enforces explicit one-shot confirmation and rejects confirmed=False."
  ports_facade: "app/ports/response_envelope.py defines no models; it is a pure re-export facade with __all__ exposing the frozen port-facing import surface so downstream ports (RuntimePort / P0-DOMAIN-007a) import ResponseEnvelope from app.ports.response_envelope. No ResponseEnvelopePort method invented (spec 8.6.8 defines none)."
  package_layout: "No __init__.py created anywhere, matching the established app/ports and tests/ namespace-package convention (mypy strict + pytest pythonpath='.'); app/contracts/__init__.py was deliberately NOT created (out of touched_paths). Canonical definitions live in app/contracts/sdui/models.py."
  data_default: "ResponseEnvelope.data defaults to None only. The spec rule that blocked/waiting_user responses default data=None (with documented exceptions) is a downstream Gateway/Runtime composition rule and is intentionally NOT hard-enforced by a cross-field validator here (that would over-constrain P0-DOMAIN-009b)."
