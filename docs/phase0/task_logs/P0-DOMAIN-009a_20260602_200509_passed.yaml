summary: >
  Defined the Phase 0 SDUI Response Envelope interface contract only. Added
  UIComponentType, UIAction, TargetSystem, ResponseEnvelopeStatus TypeAliases plus
  UIComponent and ResponseEnvelope models (exact spec section 8.6.4 field shapes),
  ConfirmCard / OperatorHandbackCard / BindingRequiredCard specializations, and a
  minimal UserAction return structure, in app/contracts/sdui/models.py.
  app/ports/response_envelope.py is a pure re-export facade exposing the frozen
  port-facing import surface (RuntimePort / P0-DOMAIN-007a imports ResponseEnvelope
  from there). No renderer, dynamic form orchestrator, multi-turn confirmation state
  machine, response composer, or ExecutionResult->ResponseEnvelope status-mapping
  logic was introduced (those belong to P0-DOMAIN-009b / Runtime). ResponseEnvelope.status
  is a local 5-value Literal; ExecutionStatus/ErrorCode/ExecutionResult from
  capability_gateway.py were not imported or modified (shared-type duplication of
  TargetSystem deliberately deferred). Executed via the Orchestrator-Worker pipeline
  in an isolated git worktree (codex exec -C): Codex generated the Plan, Claude Code
  adversarially reviewed it (amendments A1 no __init__.py, A2 ports re-export facade,
  A3 per-card action literals, A4 minimal UserAction, A5 scan hygiene), Codex
  implemented via TDD, then Claude Code and Codex cross-reviewed the diff. Codex
  cross-review returned REQUEST_CHANGES with two valid spec-fidelity findings that the
  Claude Code review and the human-approved amendments had missed; both were fixed and
  re-review returned APPROVE_FOR_COMMIT.
