summary: >
  Implemented the Phase 0 SDUI ResponseEnvelopeBuilder in app/infra/sdui/
  using only the port-facing app.ports.response_envelope import surface. The
  builder produces message, confirm_card, binding_required_card, operator
  handback, and failed envelopes; enforces non-empty fallback_text; keeps data
  null for blocked, waiting_user, and no_capability_found unless explicit
  caller data is supplied; sanitizes message, fallback_text, data, ui payload,
  and trace_summary before Pydantic construction; and serializes via
  model_dump_json(). Added the approved 22-test infra suite including all Opus
  P1/P2 mandates. No app/ports/, app/contracts/sdui/, app/runtime/,
  app/api/v1/sdui/, web renderer path, pyproject.toml, or uv.lock file was
  modified.
