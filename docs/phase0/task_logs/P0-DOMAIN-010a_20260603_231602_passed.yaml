summary: >
  Added LLMProviderPort interface contract (app/ports/llm_provider.py) and
  StructuredOutputPort interface contract (app/ports/structured_output.py) with
  56 contract tests (tests/ports/test_llm_structured_output_ports.py).
  LLMProviderPort defines complete and chat methods (satisfying complete/chat/equivalent
  AC). StructuredOutputPort defines parse_to_schema (raw_response str + schema_type
  type[BaseModel]). Return structures LLMCompletionResponse and StructuredOutputResult
  include error_code/error_message and trace_metadata fields. No concrete SDK binding
  (no openai/instructor/PydanticAI/DashScope/vLLM import). Phase 1 baseline preserved:
  raw OpenAI SDK + json_object + Pydantic model_validate + Literal enum validation.
  LLMProviderErrorCode is a new type (separate domain from ErrorCode; LLM-specific
  error codes: timeout, rate_limited, context_length_exceeded, provider_error,
  invalid_request, model_not_available).
