objective: >
  Implement a deterministic MockStructuredOutputProvider satisfying StructuredOutputPort.parse_to_schema.
  Returns predictable StructuredOutputResult for registered intents, uses schema_error for unknown inputs,
  and allows Runtime/Gateway tests without a real LLM. Phase 1 baseline unchanged.

method: TDD

## Claude-supplied judgment paragraphs:
summary: >
  MockStructuredOutputProvider implements a registry-based deterministic mock for StructuredOutputPort.
  The registry maps (raw_response_key, schema_type) -> StructuredOutputResult, ensuring determinism.
  Unknown inputs return error_code='schema_error' (a valid StructuredOutputErrorCode value - the
  failure example's suggestion of 'no_capability_found'/'structured_output_failed' was caught by
  Opus plan review as invalid and corrected in the exec mandate). Malformed sentinels trigger
  parse_error via a separate set. Implementation imports only port types; no real SDK or network code.

fix_loop_summary: >
  One fix loop applied after Stage 3b Opus diff review: (1) dead `if result.parsed is not None:`
  guard removed from test_unknown_input_returns_error_not_first_registered - guard was unreachable
  since parsed=None was already asserted. (2) Tautological `assert port_contract is StructuredOutputPort`
  replaced with real structural checks: return annotation verified via get_type_hints, parameter order
  verified via list(sig.parameters.keys()). Both fixes confirmed in re-review: APPROVE_FOR_COMMIT.

quality_observations: >
  All 17 tests pass. Parametrized coverage: all 4 StructuredOutputErrorCode values constructible,
  two invalid-code ValidationError tests (guarding against the no_capability_found/structured_output_failed
  failure example). Open-str raw_response tested on both StructuredOutputError and StructuredOutputResult.
  extra="forbid" verified on both models. Protocol conformance now uses get_type_hints + param order
  (not a tautology). Codex self-review + Opus reviewer both APPROVE_FOR_COMMIT.
  P3 observation from Opus: stored raw_response in registry entry is unused (parse_to_schema rebuilds
  from live call params). Not a contract violation; behavioral correctness confirmed.

