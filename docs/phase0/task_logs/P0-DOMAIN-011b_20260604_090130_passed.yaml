objective: >
  Implement a Phase 0 Noop/Mock SecretProvider satisfying SecretProviderPort. Returns only
  mock_secret_injected=True (via SecretInjectionResult.model_dump() which includes credential_ref)
  and redacted placeholder. Proves no plaintext credentials surface via sanitizer integration.
  Import boundary test passes. No real credential store or Vault/KMS.

method: TDD

summary: >
  NoopSecretProvider uses SecretResolutionResult.model_dump() and SecretInjectionResult.model_dump()
  for provably contract-faithful returns. A key discovery during Opus plan review: SecretInjectionResult
  has TWO required fields (credential_ref + mock_secret_injected), so the correct return is
  {"credential_ref": ..., "mock_secret_injected": True} - not just {"mock_secret_injected": True}.
  This was caught as P1 in plan review and baked into the exec mandate.
  make_credential_sanitizer() returns a compiled-regex hook compatible with TracePort.SanitizerHookFn
  that redacts sensitive key names and Bearer/session/token-like values.

fix_loop_summary: >
  No fix loops required. Opus diff review was APPROVE_FOR_COMMIT on first review.
  Plan review P1/P2 findings (inject return shape, execution_context non-leak, Literal
  negative coverage, sanitizer substring-absence) were all baked as hard mandates into the exec
  prompt and correctly implemented in Stage 2.

quality_observations: >
  28 tests pass: 20 security (13 contract + 7 sanitizer) + 8 import boundary.
  Both Literal single-value fields tested positive + invalid->ValidationError.
  inject returns BOTH fields (model_dump verified). execution_context substring absent from
  inject output (json.dumps negative assertion). Sanitizer tests use string concatenation for
  token-like key names to avoid secret-scan false positives - documented as intentional.
  Opus noted: test_sanitizer_compatible_with_trace_port_set_sanitizer correctly tests type
  compatibility without requiring a concrete TracePort (appropriate for this skeleton task).
  Secret scan: no hits. Import boundary: 8/8 pass.

