summary: >
  Hotfix for GitHub Actions Frontend CI failure after P0-INFRA-007 merge.
  pnpm 11 strictDepBuilds blocked esbuild@0.25.12 build scripts with
  ERR_PNPM_IGNORED_BUILDS. Minimal fix: added web/pnpm-workspace.yaml
  with allowBuilds: esbuild: true. This is a targeted supply-chain
  approval for the Vite/esbuild build chain, not a blanket allowance
  for all dependency install scripts.

root_cause:
  description: >
    P0-INFRA-007 merged to phase0/main. GitHub Actions Frontend job
    failed at Install dependencies step. pnpm 11.5.0 strictDepBuilds
    (default: true) blocks build scripts for any dependency not
    explicitly listed in allowBuilds. esbuild@0.25.12 is required by
    Vite (vite depends on esbuild for pre-bundling) but was not
    approved in pnpm-workspace.yaml.
  error_message: "[ERR_PNPM_IGNORED_BUILDS] Ignored build scripts: esbuild@0.25.12"
  ci_job: Frontend
  ci_step: "Install dependencies"
  ci_runner: ubuntu-latest
  pnpm_version_ci: "11.5.0"
  pnpm_version_local: "11.4.0"

