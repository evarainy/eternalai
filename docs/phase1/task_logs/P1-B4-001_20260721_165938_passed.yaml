    result: passed
    evidence: "Tests map initial input and prior output and mutate the source definition mid-run while retaining version 1.0.0."
  - criterion: "Gateway unique entry and registered low-risk capabilities only"
    result: passed
    evidence: "Validation rejects missing, inactive, high-risk, and nested Workflow capabilities before Adapter execution."
  - criterion: "Step Trace order, terminal state, and sensitive-value exclusion"
    result: passed
    evidence: "Tests assert capability_selected, Gateway, Adapter, Gateway terminal order and exclude the runtime sensitive sentinel from Trace and TaskStore."
  - criterion: "Invalid step_output references fail before the first Gateway call"
    result: passed
    evidence: "Follow-up tests cover nonexistent, self, and forward references in input_mapping and when; Adapter calls remain zero."
  - criterion: "Missing Workflow engine uses the standard failed terminal chain"
    result: passed
    evidence: "Follow-up test asserts failed envelope, internal_error, update_status(failed), task_failed, finalize_task_trace, and zero Gateway calls."
