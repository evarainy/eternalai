summary: >
  Added the minimal strictly linear Workflow engine skeleton. Steps execute in order,
  use simple sequential when conditions, map Workflow and prior-step values, lock one
  definition version snapshot, and invoke only registered active low-risk capabilities
  through CapabilityGatewayPort. Runtime routes registered Workflow capabilities to the
  engine while preserving the ordinary capability path. Safe step state is observable in
  Trace and TaskStore without arguments, outputs, or sensitive values. Follow-up commit
  5c8f3d7 closed the two accepted low product findings: invalid non-earlier step_output
  references now fail before Gateway execution, and a missing Workflow engine now uses the
  existing internal_error failure envelope and terminal Task/Trace chain.
