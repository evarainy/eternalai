summary: >
  Added same-process, same-task human-gate recovery. Waiting writes a dedicated safe
  checkpoint evidence event, while the locked definition and recovery values remain only
  in engine memory. Explicit confirmation resumes the original task/trace through an
  independently registered confirmed capability and continues later steps. Runtime binds
  pending recovery to session plus user, and terminal recovery clears the checkpoint.
