  - criterion: "Confirmation uses a distinct confirmed capability through Registry and Gateway"
    result: passed
    evidence: "Real MinimalPolicyGuard test observes original _confirm short-circuit and confirmed_mock Adapter execution."
  - criterion: "Locked Workflow version and definition survive waiting"
    result: passed
    evidence: "Definitions mutate to 2.0.0 before resume; result and every Workflow event remain 1.0.0."
  - criterion: "Runtime resumes only the original session/user task and trace"
    result: passed
    evidence: "Cross-user and cross-session confirmation text follows ordinary routing; matching confirmation reuses task_id and trace_id."
  - criterion: "Sensitive values remain absent from Trace and TaskStore state"
    result: passed
    evidence: "Tests inject a sensitive sentinel and assert it is absent from both evidence stores."
