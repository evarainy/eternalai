summary: >
  Added a fixed one-retry policy for adapter_timeout only. Workflow failures now stop
  before later steps, preserve the Gateway error code, return failed or timeout through
  Runtime without task_completed, and expose attempt metadata. Terminal failure during
  confirm recovery clears both the engine checkpoint and Runtime pending entry.
acceptance_criteria_result:
  - criterion: "Retry allowlist is explicit, minimal, and bounded to one retry"
    result: passed
    evidence: "Constants and tests lock adapter_timeout as the sole entry and two Gateway calls as the maximum."
  - criterion: "Deterministic errors terminate without retry and later steps are not called"
    result: passed
    evidence: "Eight-case matrix asserts one Gateway call for policy, confirm, capability, identity, and payload failures."
  - criterion: "Retry exhaustion stops all later Gateway and Adapter calls"
    result: passed
    evidence: "Real Gateway/Adapter integration test observes exactly two unstable Adapter calls and no later call."
  - criterion: "Workflow failed/timeout terminal state preserves error_code without task_completed"
    result: passed
    evidence: "Runtime parameterized test asserts TaskStore, terminal Trace, and finalization retain the Gateway code."
  - criterion: "Failure during confirmation recovery clears checkpoint and pending"
    result: passed
    evidence: "Second engine resume is rejected and repeated confirmation creates a distinct ordinary task."
  - criterion: "Trace ownership and sensitive-value boundaries remain intact"
    result: passed
    evidence: "Gateway emits exactly one adapter_error_mapped per failed attempt; Workflow evidence contains no sentinel."
failure_examples_tested:
  - example: "Two adapter_timeout results are reported as completed or permit the next step"
    result: triggered
    evidence: "Result is timeout with adapter_timeout; next Gateway and Adapter are never called."
  - example: "A deterministic identity or payload error is retried"
    result: triggered
    evidence: "Parameterized calls remain exactly one for every required deterministic error code."
  - example: "A failed confirmed capability leaves a reusable recovery window"
    result: triggered
    evidence: "Engine rejects another resume and Runtime routes the repeated message as a new task."
  - example: "Workflow failure produces task_completed or rewrites the error as internal_error"
    result: triggered
    evidence: "Failure traces contain task_failed only and preserve adapter_timeout/adapter_http_500."
