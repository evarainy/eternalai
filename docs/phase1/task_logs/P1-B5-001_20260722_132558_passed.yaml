summary: >
  Runtime now receives a bounded process-local SessionMemory. Only completed
  capability identifiers become structured summaries; exact tenant/session/user
  keys isolate recall, and hard per-context plus global limits prevent unbounded growth.
acceptance_criteria_result:
  - criterion: "Same session and ai_user can use prior successful structured context"
    result: passed
    evidence: >
      tests/runtime/test_runtime_session_memory.py proves the follow-up succeeds only
      when the prior capability summary is present in the exact-key LLM context.
  - criterion: "Different session and different ai_user cannot read owner memory"
    result: passed
    evidence: >
      Separate pytest parameter instances assert no memory system message and a
      no_capability_found outcome for each isolation dimension.
  - criterion: "Tenant is structurally present and honestly reported"
    result: passed
    evidence: >
      SessionMemoryKey is (tenant_id, session_id, ai_user_id). Runtime currently
      supplies only default; no end-to-end cross-tenant verification is claimed.
  - criterion: "Capacity has exact hard limits"
    result: passed
    evidence: >
      MAX_ENTRIES_PER_CONTEXT=5 and MAX_CONTEXTS=32; tests assert the sixth-entry
      and thirty-third-context eviction results exactly.
  - criterion: "Sensitive values and full payloads do not enter memory, trace, or context"
    result: passed
    evidence: >
      Runtime passes only capability_id after completed; memory rejects all required
      credential assignment families; synthetic credential payload tests remain absent
      from memory state, recorded trace, next LLM context, and ResponseEnvelope.
  - criterion: "Failures do not leave success-looking memory"
    result: passed
    evidence: >
      denied, failed, waiting_user, and no_capability_found each leave entry_count zero.
  - criterion: "Ports, dependencies, Golden, and B2-B4 behavior do not regress"
    result: passed
    evidence: >
      No Port/manifest/Golden diff; architecture 23/23 and Golden gate 23/23 passed.
failure_examples_tested:
