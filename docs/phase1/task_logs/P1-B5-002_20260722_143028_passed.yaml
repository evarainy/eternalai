summary: >
  Runtime now injects a small global Semantic/System Knowledge message. Static
  terms, Mock facts, and policy templates are immutable code data; capability
  descriptions and no-capability guidance are derived from the live Registry.
  Knowledge is global and deliberately has no tenant, session, or user isolation
  semantics; B5-001 Session Memory remains the independently isolated data plane.
acceptance_criteria_result:
  - criterion: "Required basic knowledge content exists without external loading"
    result: passed
    evidence: >
      Frozen code tuples cover enterprise terms, Mock systems, and policy templates;
      deterministic keyword hit/miss tests pass without file, DB, or network access.
  - criterion: "Capability descriptions have one Registry source of truth"
    result: passed
    evidence: >
      Runtime reads CapabilityRegistryPort.list per request; A/B snapshot tests prove
      changed Registry data replaces old descriptions in consecutive Runtime calls and
      no capability list is static.
  - criterion: "Intent injection has exact small hard bounds and coexists with Memory"
    result: passed
    evidence: >
      MAX_KNOWLEDGE_ITEMS=8 and MAX_KNOWLEDGE_ITEM_LENGTH=240 are asserted against
      decoded provider messages; knowledge and memory remain independent system messages.
  - criterion: "No-capability guidance preserves the negative terminal"
    result: passed
    evidence: >
      Runtime tests retain no_capability_found/capability_not_found and blocked Trace,
      while the envelope lists only active capabilities and Admin Lite > Registry.
  - criterion: "Knowledge never authorizes disabled or missing capabilities"
    result: passed
    evidence: >
      Selector inputs still traverse the real Registry gate; disabled and missing cases
      make zero Gateway calls and finish at the unchanged negative terminal.
  - criterion: "Sensitive values do not enter knowledge, prompt, Trace, state, or response"
    result: passed
    evidence: >
      Synthetic credential, URL/IP, email/person, and owner markers are removed at the
      knowledge boundary and again at final prompt injection; all observed surfaces pass.
  - criterion: "Mock LLM evidence is honest"
    result: passed
    evidence: >
      No test attributes a selector to system knowledge. Evidence is limited to pure
      lookup, actual provider messages, Registry gates, Gateway calls, and terminal state.
