summary: >
  Runtime now emits one distinct evaluation_recorded event for every terminal
  business result on the direct, Workflow-resume, and no-capability paths. The
  deterministic Evaluator maps completed to passed and every non-success terminal
  to failed. Evaluator exceptions become an explicit error conclusion while the
  ResponseEnvelope, TaskStatus, and business error_code remain unchanged.
acceptance_criteria_result:
  - criterion: "All three terminal paths produce exactly one evaluation conclusion"
    result: passed
    evidence: >
      Runtime integration tests cover direct execution, Workflow resume, and
      _finish_no_capability_found with exact event counts and task identity.
  - criterion: "Business terminal and Evaluator result are trace-distinguishable"
    result: passed
    evidence: >
      TraceEventType has a dedicated evaluation_recorded value; business terminal
      events remain unchanged and precede the independent evaluation event.
  - criterion: "Terminal mapping is complete and deterministic"
    result: passed
    evidence: >
      Parameterized unit and Runtime tests cover completed, failed, denied,
      binding_required, timeout, and no_capability_found without LLM, time, or random input.
  - criterion: "Evaluator cannot rewrite business outcome"
    result: passed
    evidence: >
      Baseline-versus-raising-Evaluator comparisons cover all six terminal statuses
      and assert identical ResponseEnvelope.status, TaskStatus, and error_code.
  - criterion: "Evaluator failure is visible but does not break the main chain"
    result: passed
    evidence: >
      A raising Evaluator returns the original response and task state plus one failed
      evaluation_recorded event with evaluation_result=error and reason=evaluator_error.
  - criterion: "waiting_user never produces an evaluation conclusion"
    result: passed
    evidence: >
      Initial Workflow waiting and a second waiting resume both assert zero evaluation
      events and zero Trace finalizations.
  - criterion: "Sensitive business data cannot enter evaluation Trace or state"
    result: passed
    evidence: >
      Evaluator accepts only closed status and ErrorCode values. Credential sentinels in
      exec_result.data and exception text are absent from evaluation Trace and task state.
failure_examples_tested:
  - example: "A business failure is evaluated as passed"
    result: triggered
    evidence: "All five non-success terminal classes assert evaluation_result=failed."
  - example: "Evaluator exception is swallowed as success or breaks the response"
    result: triggered
    evidence: >
      Six terminal comparisons assert evaluation_result=error and unchanged business output.
  - example: "Workflow waiting or repeated waiting is evaluated twice"
    result: triggered
    evidence: "Both waiting checkpoints retain zero evaluation events."
  - example: "Workflow resume terminal omits its evaluation"
    result: triggered
    evidence: "Resume completion records exactly one event on the original task and trace."
  - example: "exec_result.data or exception secrets enter Trace attributes"
    result: triggered
    evidence: "Explicit password, access_token, Bearer, and exception-message sentinels stay absent."
