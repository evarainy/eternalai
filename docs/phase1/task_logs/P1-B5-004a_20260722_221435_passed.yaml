summary: >
  Admin Lite now exposes role-guarded Registry list/get/create/enable/disable APIs.
  Create always persists draft; enable is separate; deprecated transitions fail.
  Every success, denial, miss, and invalid transition records an admin_action Trace.
  Returned views omit schemas and policy content, and the management plane has no
  path to Runtime, Gateway, or Adapter execution.
acceptance_criteria_result:
  - criterion: "Registry list and detail return credential-safe metadata"
    result: passed
    evidence: >
      API tests list and view an entry whose hidden schemas contain password/cookie
      property names, then assert schemas, policy_digest, and those names are absent.
  - criterion: "Create, enable, and disable are separate controlled actions"
    result: passed
    evidence: >
      Service and API tests prove create returns draft, client-supplied status is 422,
      enable changes draft to active, and disable changes active to disabled.
  - criterion: "Status transitions are complete and stable"
    result: passed
    evidence: >
      Tests cover draft/disabled enable, active enable idempotence, draft/active
      disable, disabled disable idempotence, and both deprecated 409 paths.
  - criterion: "Role denial protects read and write without existence disclosure"
    result: passed
    evidence: >
      Existing and missing detail URLs both return the exact same 403
      role_not_allowed body before any Registry call; a separate create denial test
      proves zero mutation and blocked Trace.
  - criterion: "Every management action is traceable"
    result: passed
    evidence: >
      admin_action events assert action, decision, safe transition metadata,
      role_claim_source=request_header, and role_claim_authenticated=false for
      successful, blocked, not-found, and invalid-transition paths.
  - criterion: "Management routes cannot execute business capabilities"
    result: passed
    evidence: >
      Success and denial API tests inject a Runtime to Gateway to Adapter sentinel
      chain and assert all three call counts remain zero. The admin import boundary
      also rejects execution and Infra dependencies.
  - criterion: "B2-B4 safety order and Golden behavior do not change"
    result: passed
    evidence: >
      Non-DB full suite passed 985 tests; existing Gateway, Identity, Policy,
      Workflow, Runtime, and Golden tests all ran. Golden gate remained 23/23 with
      negative 14/14.
  - criterion: "Role authentication state is recorded honestly"
    result: passed
    evidence: >
      角色是未经认证的请求声明，真实部署前需前置认证。Golden 的 given.roles
      仅做 fixture schema 校验，harness 未接通；本任务没有复用现有角色机制。
failure_examples_tested:
  - example: "Create payload requests active and bypasses draft"
    result: triggered
    evidence: "Extra status field returns 422 with zero Registry and Trace calls."
  - example: "Missing role reads an existing or missing protected resource"
    result: triggered
    evidence: "Both paths return identical 403 bodies with zero Registry calls."
  - example: "Missing role mutates Registry"
    result: triggered
    evidence: "Denied create records blocked Trace and makes zero Registry calls."
  - example: "Admin role unlocks an unrelated admin_* capability"
    result: triggered
    evidence: >
      MinimalPolicyGuard allows only five exact Registry action IDs; an admin role
      still receives admin_action_not_allowed for admin_delete_user.
  - example: "Deprecated capability is re-enabled or disabled"
    result: triggered
    evidence: "Both transitions fail without mutation and record failed Trace."
  - example: "Admin API is accidentally wired to execution"
    result: triggered
    evidence: >
      Runtime/Gateway/Adapter sentinel tests would increment all counters and fail;
      current success and denial paths keep all counters at zero.
