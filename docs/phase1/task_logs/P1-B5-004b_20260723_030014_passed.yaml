summary: >
  Admin Lite now lists Tasks by session or user, reads a Task's event sequence,
  and lists Binding state for one required ai_user_id. All three actions reuse the
  existing management Policy and Trace path, return explicit credential-safe views,
  and are fixed at 100 results with no client-adjustable limit. Unknown Task event
  payload fields are discarded. Admin routes never call Runtime, Gateway, Adapter,
  or Workflow. PostgreSQL reads use the existing tables and require no migration.
acceptance_criteria_result:
  - criterion: "Binding status is visible only by required ai_user_id with optional existing filters"
    result: passed
    evidence: >
      API tests pass target_system, binding_scope, account_set_id, and
      device_domain_id to IdentityMappingPort.list_mappings; no global list or
      IdentityMappingPort change exists. The response contains only eight named fields.
  - criterion: "Task list exposes status, capability_id, and error_code by session or user"
    result: passed
    evidence: >
      PostgreSQL integration tests cover session-only, user-only, and intersection
      filters. The API view exposes six fields and excludes trace_id.
  - criterion: "Task event evidence never exposes raw payload"
    result: passed
    evidence: >
      A real API response is built from an event containing password, access_token,
      future_payload, and a secret sentinel. Tests assert every unknown field and
      value is absent while allowlisted capability evidence remains.
  - criterion: "Every list is hard-bounded at exactly 100"
    result: passed
    evidence: >
      PostgreSQL Task and event queries use fixed LIMIT 100. Admin service also caps
      all three response types. API requests with limit=-1 and limit=999999999 still
      return exactly 100; no route declares a limit parameter.
  - criterion: "Each action denies before resource access without existence disclosure"
    result: passed
    evidence: >
      Task list, Task events, and Binding list each test existing and missing
      identifiers. All six cases return the identical 403 role_not_allowed body,
      record blocked Trace, and keep TaskStore and IdentityMapping calls at zero.
  - criterion: "Every successful and denied action records Trace"
    result: passed
    evidence: >
      Success tests assert tasks_list, task_events_list, and bindings_list actions
      with result counts. Denial tests assert blocked status and
      role_claim_authenticated=false. No query payload or role value is recorded.
  - criterion: "Management data routes cannot reach the execution plane"
    result: passed
    evidence: >
      Each new route injects Runtime, Gateway, Adapter, and Workflow sentinels and
      asserts all four counters remain zero. Architecture also forbids Admin API
      direct Port or Infra imports and Admin service execution/Infra imports.
  - criterion: "B2-B4 behavior and Frozen Golden remain unchanged"
    result: passed
    evidence: >
      Full suite passed 1051 tests with 0 skipped and 0 failed. Golden remained
      23/23 with negative 14/14; no Golden file changed.
  - criterion: "Role authentication state and Trace debt remain honest"
    result: passed
    evidence: >
      X-EternalAI-Roles remains an unauthenticated request claim; Phase 1 has not
      established caller identity. TracePort is called but remains non-persistent
      under the recorded P2-TRACE-PERSIST-001 debt. Neither limitation is upgraded
      into a stronger claim or bypassed with a second persistence path.
failure_examples_tested:
  - example: "Unknown or credential-like Task event payload fields reach the API"
    result: triggered
    evidence: "password, access_token, future_payload, and secret sentinel are absent from the response."
  - example: "Negative or huge client limit creates an unbounded response"
    result: triggered
    evidence: "limit=-1 and limit=999999999 both return exactly 100 Task items; event and Binding paths also cap at 100."
  - example: "Missing management role probes whether a Task or user exists"
    result: triggered
    evidence: "Existing and missing cases return identical 403 bodies before any Store or Mapping call."
  - example: "Authorized event lookup probes an unknown Task"
    result: triggered
    evidence: "Returns stable 404 task_not_found after authorization and never calls list_events."
  - example: "Task list is requested without a bounding filter"
    result: triggered
    evidence: "Returns stable 422 task_filter_required after role guard and makes zero TaskStore calls."
  - example: "Admin data route reaches business execution"
    result: triggered
    evidence: "All three routes keep Runtime, Gateway, Adapter, and Workflow counters at zero."
  - example: "TaskStore list implementation omits or weakens the fixed bound"
    result: triggered
    evidence: "Real PostgreSQL tests insert 101 matching rows/events and assert the deterministic first 100 only."
