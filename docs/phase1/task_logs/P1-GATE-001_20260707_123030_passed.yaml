summary: >
  Implemented the Golden Task regression gate. scripts/run_golden_tasks.py now
  supports --gate, prints the same JSON summary as --summary, returns 1 for
  threshold gate failures, and preserves infrastructure failure exit 2. The
  gate uses evaluate_gate(summary) and covers failed>0, skipped default-fail
  with an initially empty exemption set, positive >=80% by integer
  cross-multiplication, negative ==100%, unknown category fail-closed, and
  empty effective denominators fail-closed. build_summary keeps existing keys
  and adds only positive_total, negative_total, positive_not_applicable, and
  negative_not_applicable. CI Golden tasks step now invokes --gate.
method: TDD
