summary: >
  Web and CLI input now enters one runtime-local IntentRouter that normalizes text,
  calls the frozen LLMProviderPort with JSON-object response format, and validates the
  frozen StructuredOutputPort result through Pydantic v2. Runtime filters Registry
  candidates by active status and optional target/type constraints, selects only an
  exact or unique deterministic match, persists the selection, and traces only safe
  enums and selector fingerprints. Invalid, unavailable, disabled, or ambiguous intent
  paths preserve the existing no_capability_found ResponseEnvelope and GT-008 short
  circuit without entering Identity, Policy, Gateway, or an Adapter.
